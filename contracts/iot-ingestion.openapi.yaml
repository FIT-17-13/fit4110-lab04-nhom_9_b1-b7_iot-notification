openapi: 3.1.0
info:
  title: Smart Campus - IoT Ingestion Service (B1)
  version: 1.0.0
  description: API hợp đồng cho IoT Ingestion, giao tiếp với Core Business và Analytics.
servers:
  - url: http://localhost:4010
    description: Prism Mock Server
  - url: http://localhost:8000
    description: Local Dev Server

paths:
  /events/ingest:
    post:
      summary: Ingest sensor event (CloudEvents format)
      operationId: ingestEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudEvent_SensorReading'
      responses:
        '201':
          description: Event accepted
          headers:
            X-Warning:
              description: Cảnh báo nếu giá trị vượt ngưỡng cực đoan
              schema:
                type: string
        '400':
          description: Bad Request (Sai payload hoặc thiếu trường bắt buộc)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /analytics/iot/telemetry/aggregated:
    get:
      summary: Lấy dữ liệu telemetry đã tổng hợp cho Analytics
      operationId: getAggregatedTelemetry
      parameters:
        - name: zoneId
          in: query
          required: true
          schema:
            type: string
            pattern: '^ZONE-[A-Z]+-\d{2}$'
            example: ZONE-HANOI-01
      responses:
        '200':
          description: Trả về dữ liệu đa hình (Polymorphic) cho thiết bị
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryReport'
        '400':
          description: Thiếu zoneId hoặc định dạng sai
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    CloudEvent_SensorReading:
      type: object
      required: [eventId, eventType, occurredAt, source, data]
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          example: sensor.reading.created
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
        source:
          type: string
        data:
          type: object
          required: [deviceId, locationId, value, unit]
          properties:
            deviceId:
              type: string
            locationId:
              type: string
              pattern: '^BUILDING-[A-Z0-9]+-ROOM-\d{3}$'
            value:
              type: number
            unit:
              type: string
              enum: [celsius, percent, ppm, boolean]

    TelemetryReport:
      type: object
      required: [reportType, zoneId, timestamp]
      discriminator:
        propertyName: reportType
      properties:
        reportType:
          type: string
          enum: [sensor, actuator]
        zoneId:
          type: string
        timestamp:
          type: string
          format: date-time
        minLimit:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]

    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string